name: Deploy to Azure VM

on:
  push:
    branches:
      - prod
      - uat
      - qa

# Cancel in-flight deploys for the same branch when a new push lands —
# we don't want two deploys fighting over PM2 / ports.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    # Only deploy from the canonical repo (the VM's git remote). The workflow
    # also exists on the mirror repo because branches are pushed to both remotes;
    # guarding by repository stops the mirror's runs from failing on missing
    # secrets and prevents two repos racing to deploy to the same VM.
    # Production deploys from `prod`, and only from `prod`.
    #
    # This used to fire on Opportunity_MVC, the day-to-day working branch, so
    # every routine push deployed production and restarted its backend — which
    # logs out every signed-in user. A `prod` branch already existed and,
    # confusingly, was not what deployed production. Promotion is now a
    # deliberate act: fast-forward prod when you mean it.
    if: github.ref == 'refs/heads/prod' && github.repository == 'QuantumBusinessAdvisory/QCRM'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy Production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -eo pipefail
            APP_DIR=/home/azureuser/app
            ECO=$APP_DIR/ecosystem.config.js
            cd $APP_DIR

            echo "=== Pull latest code ==="
            git fetch origin prod
            git checkout prod
            git reset --hard origin/prod

            chmod +x scripts/pm2-safe-restart.sh scripts/verify-frontend-build.sh scripts/build-and-swap.sh

            echo "=== Backend: install + generate + compile ==="
            cd $APP_DIR/backend
            # Install ALL deps (need prisma CLI from devDependencies)
            npm ci 2>&1 | tail -5
            # Postinstall already runs prisma generate; this is belt + braces.
            npx prisma generate 2>&1 | tail -3
            # Compile TS — show full output so errors are visible in CI logs.
            npx tsc

            echo "=== Restart backend safely ==="
            bash $APP_DIR/scripts/pm2-safe-restart.sh qcrm-backend 3001 $ECO

            echo "=== Frontend: install + build ==="
            cd $APP_DIR/agentic-crm
            npm ci 2>&1 | tail -5
            # Build into a scratch dir and swap it in, so the live .next is
            # untouched during the build. Building in place deletes the assets
            # the running server is still advertising, which 404s every
            # /_next/static/* request for the ~3 min the build takes.
            sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true
            NODE_OPTIONS='--max-old-space-size=3072' bash $APP_DIR/scripts/build-and-swap.sh $APP_DIR npm run build 2>&1 | tail -12

            echo "=== Restart frontend safely ==="
            bash $APP_DIR/scripts/pm2-safe-restart.sh qcrm-frontend 3000 $ECO

            # A bound port is NOT proof the frontend is healthy: `next build`
            # rewrites .next in place, so a process that was not restarted keeps
            # serving deleted asset URLs and the page renders unstyled while still
            # returning 200. Assert the served HTML matches the BUILD_ID on disk
            # and that its assets resolve; repair and fail loudly otherwise.
            bash $APP_DIR/scripts/verify-frontend-build.sh $APP_DIR 3000 qcrm-frontend $ECO

            echo "=== Production deployment complete ==="
            pm2 list | grep -E 'qcrm-(backend|frontend)\b' || true

  deploy-uat:
    if: github.ref == 'refs/heads/uat' && github.repository == 'QuantumBusinessAdvisory/QCRM'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy UAT
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -eo pipefail
            APP_DIR=/home/azureuser/uat
            ECO=$APP_DIR/ecosystem.config.js
            cd $APP_DIR

            echo "=== Pull latest UAT code ==="
            git fetch origin uat
            git checkout uat
            git reset --hard origin/uat

            chmod +x scripts/pm2-safe-restart.sh scripts/verify-frontend-build.sh scripts/build-and-swap.sh

            echo "=== Backend: install + generate + compile ==="
            cd $APP_DIR/backend
            npm ci 2>&1 | tail -5
            npx prisma generate 2>&1 | tail -3
            npx tsc

            echo "=== Restart UAT backend safely ==="
            # UAT backend listens on 3005 (see deploy/PORT_MAP.md). A wrong port
            # here makes pm2-safe-restart fuser-kill the OTHER env's backend and
            # then fail the bind-wait. Keep in sync with backend/.env PORT.
            bash $APP_DIR/scripts/pm2-safe-restart.sh qcrm-uat-backend 3005 $ECO

            echo "=== Frontend: install + build ==="
            cd $APP_DIR/agentic-crm
            npm ci 2>&1 | tail -5
            # Scratch-dir build + swap; see the production job for why.
            sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true
            NEXT_PUBLIC_API_URL='https://uat-qcrm.qbadvisory.com' NODE_OPTIONS='--max-old-space-size=3072' bash $APP_DIR/scripts/build-and-swap.sh $APP_DIR npm run build 2>&1 | tail -12

            echo "=== Restart UAT frontend safely ==="
            bash $APP_DIR/scripts/pm2-safe-restart.sh qcrm-uat-frontend 3002 $ECO

            # A bound port is NOT proof the frontend is healthy: `next build`
            # rewrites .next in place, so a process that was not restarted keeps
            # serving deleted asset URLs and the page renders unstyled while still
            # returning 200. Assert the served HTML matches the BUILD_ID on disk
            # and that its assets resolve; repair and fail loudly otherwise.
            bash $APP_DIR/scripts/verify-frontend-build.sh $APP_DIR 3002 qcrm-uat-frontend $ECO

            echo "=== UAT deployment complete ==="
            pm2 list | grep -E 'qcrm-uat-' || true

  deploy-qa:
    if: github.ref == 'refs/heads/qa' && github.repository == 'QuantumBusinessAdvisory/QCRM'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy QA
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -eo pipefail
            APP_DIR=/home/azureuser/qa
            ECO=$APP_DIR/ecosystem.config.js
            cd $APP_DIR

            echo "=== Pull latest QA code ==="
            git fetch origin qa
            git checkout qa
            git reset --hard origin/qa

            chmod +x scripts/pm2-safe-restart.sh scripts/verify-frontend-build.sh scripts/build-and-swap.sh

            echo "=== Backend: install + generate + compile ==="
            cd $APP_DIR/backend
            npm ci 2>&1 | tail -5
            npx prisma generate 2>&1 | tail -3
            npx tsc

            echo "=== Restart QA backend safely ==="
            # QA backend listens on 3003 (see deploy/PORT_MAP.md). A wrong port
            # here makes pm2-safe-restart fuser-kill the OTHER env's backend and
            # then fail the bind-wait. Keep in sync with backend/.env PORT.
            bash $APP_DIR/scripts/pm2-safe-restart.sh qcrm-qa-backend 3003 $ECO

            echo "=== Frontend: install + build ==="
            cd $APP_DIR/agentic-crm
            npm ci 2>&1 | tail -5
            # Scratch-dir build + swap; see the production job for why.
            sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true
            NEXT_PUBLIC_API_URL='https://qa-qcrm.qbadvisory.com' NODE_OPTIONS='--max-old-space-size=3072' bash $APP_DIR/scripts/build-and-swap.sh $APP_DIR npm run build 2>&1 | tail -12

            echo "=== Restart QA frontend safely ==="
            bash $APP_DIR/scripts/pm2-safe-restart.sh qcrm-qa-frontend 3004 $ECO

            # A bound port is NOT proof the frontend is healthy: `next build`
            # rewrites .next in place, so a process that was not restarted keeps
            # serving deleted asset URLs and the page renders unstyled while still
            # returning 200. Assert the served HTML matches the BUILD_ID on disk
            # and that its assets resolve; repair and fail loudly otherwise.
            bash $APP_DIR/scripts/verify-frontend-build.sh $APP_DIR 3004 qcrm-qa-frontend $ECO

            echo "=== QA deployment complete ==="
            pm2 list | grep -E 'qcrm-qa-' || true
